<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yari AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <button class="chats-toggle" id="chatsToggle">чаты ▾</button>
        <div class="header-name-group">
          <img class="brand-logo" src="yari-logo-white.svg" alt="Yari" style="height:80px; width:auto; display:block;" />
          <div class="header-name-stack">
            <span class="header-name-text">Yari</span>
            <span class="header-status" id="status">
              <span id="statusText">на связи</span>
              <span class="typing-dots" id="statusDots" style="display:none;"><span></span><span></span><span></span></span>
            </span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <button class="new-chat-btn" id="newChatBtn" title="новый чат" aria-label="новый чат">+</button>
        <button class="icon-btn" id="profileToggle" aria-label="профиль" title="профиль">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"></path>
          </svg>
        </button>
        <button class="chats-toggle" id="authToggle">войти</button>
      </div>
    </div>
  </header>

  <div class="app">
    <div class="guest-banner" id="guestBanner">
      <span>гостевой режим: 1 чат, до 50 сообщений в день</span>
      <button id="guestBannerBtn">войти / зарегистрироваться</button>
    </div>

    <div class="chats-panel" id="chatsPanel">
      <div class="panel-title">чаты</div>
      <div class="chats-list" id="chatsList"></div>
    </div>

    <div class="profile-panel" id="profilePanel">
      <div class="profile-identity" id="profileIdentity">
        <button class="profile-edit-btn" id="profileEditBtn" type="button" aria-label="редактировать аккаунт" title="редактировать аккаунт">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
        </button>
        <div class="profile-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"></path>
          </svg>
        </div>
        <div class="profile-email" id="profileEmail"></div>

        <div class="profile-edit-menu" id="profileEditMenu">
          <div class="profile-edit-row">
            <label class="profile-section-label" for="newEmailInput">изменить email</label>
            <div class="profile-edit-inline">
              <input type="email" id="newEmailInput" placeholder="новый email" autocomplete="email" />
              <button type="button" class="profile-icon-confirm" id="saveEmailBtn" aria-label="сохранить" title="сохранить">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </button>
            </div>
            <div class="profile-edit-msg" id="emailEditMsg"></div>
          </div>
          <button type="button" class="profile-link-danger" id="deleteAccountBtn">удалить аккаунт</button>
        </div>
      </div>
      <div>
        <div class="profile-section-label">цвет твоего облачка</div>
        <div class="swatches" id="swatches">
          <button class="swatch" style="background:linear-gradient(160deg,#e2536a 0%,#f6a94e 100%)" data-color="linear-gradient(160deg,#e2536a 0%,#f6a94e 100%)" title="закат"></button>
          <button class="swatch" style="background:linear-gradient(160deg,#c2255c 0%,#ff6f91 100%)" data-color="linear-gradient(160deg,#c2255c 0%,#ff6f91 100%)" title="фуксия"></button>
          <button class="swatch" style="background:linear-gradient(160deg,#5b4fc4 0%,#9b8cf2 100%)" data-color="linear-gradient(160deg,#5b4fc4 0%,#9b8cf2 100%)" title="индиго"></button>
          <button class="swatch" style="background:linear-gradient(160deg,#1f8fd6 0%,#6fd8f2 100%)" data-color="linear-gradient(160deg,#1f8fd6 0%,#6fd8f2 100%)" title="неон-синий"></button>
          <button class="swatch" style="background:linear-gradient(160deg,#2e9e6b 0%,#8fe3b0 100%)" data-color="linear-gradient(160deg,#2e9e6b 0%,#8fe3b0 100%)" title="зелёный"></button>
        </div>
      </div>
      <div>
        <div class="profile-section-label">угловатость облачков</div>
        <div class="radius-row">
          <input type="range" id="radiusSlider" min="0" max="26" value="14" />
          <div class="radius-preview" id="radiusPreview"></div>
        </div>
      </div>
      <button type="button" class="profile-link-danger" id="profileLogoutBtn" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        выйти
      </button>
      <button type="button" class="profile-link-cta" id="profileLoginCta" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        войти / создать аккаунт
      </button>
    </div>

    <div class="auth-panel" id="authPanel">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" type="button">вход</button>
        <button class="auth-tab" id="tabRegister" type="button">регистрация</button>
      </div>
      <form class="auth-form" id="loginForm">
        <input type="email" id="loginEmail" placeholder="email" required autocomplete="email" />
        <input type="password" id="loginPassword" placeholder="пароль" required autocomplete="current-password" />
        <button type="submit">войти</button>
      </form>
      <a href="#" class="auth-forgot-link" id="forgotPasswordLink">забыли пароль?</a>
      <form class="auth-form" id="registerForm" style="display:none">
        <input type="email" id="registerEmail" placeholder="email" required autocomplete="email" />
        <input type="password" id="registerPassword" placeholder="пароль (от 6 символов)" required autocomplete="new-password" />
        <button type="submit">зарегистрироваться</button>
      </form>
      <form class="auth-form" id="forgotForm" style="display:none">
        <input type="email" id="forgotEmail" placeholder="email" required autocomplete="email" />
        <button type="submit">отправить ссылку для сброса</button>
      </form>
      <form class="auth-form" id="resetForm" style="display:none">
        <input type="password" id="resetPassword" placeholder="новый пароль (от 6 символов)" required autocomplete="new-password" />
        <button type="submit">сохранить новый пароль</button>
      </form>
      <div class="auth-error" id="authError"></div>
    </div>

    <main class="chat" id="chat"></main>

    <form class="composer" id="composer">
      <textarea id="input" placeholder="напиши что-нибудь…" rows="1"></textarea>
      <button type="submit" id="send">отправить</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
