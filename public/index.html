<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ИИшка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-name">Yari</div>
      <div class="header-status" id="status">на связи</div>
    </header>

    <main class="chat" id="chat">
      <div class="msg msg-bot">
        const SYSTEM_PROMPT = `Тебя зовут Yari. Пользователь может звать тебя "ИИшка" — это твоё прозвище, реагируй на оба варианта одинаково. Ты — собеседник в чате на личном сайте.
        <div class="msg-bubble">привет. пиши, о чём хотела поговорить — я тут.</div>
      </div>
    </main>

    <form class="composer" id="composer">
      <textarea id="input" placeholder="напиши что-нибудь…" rows="1"></textarea>
      <button type="submit" id="send">отправить</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
