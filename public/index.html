<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yari AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <button class="chats-toggle" id="chatsToggle">чаты ▾</button>
        <div class="header-name-group">
          <svg class="brand-mark" width="26" height="13" viewBox="0 0 26 13" fill="none" aria-hidden="true">
            <path d="M1 8C2.5 3 5.5 1 8.5 1C11 1 12.5 4 12 8C11.7 5.5 10 3 8.5 3C6.5 3 3.5 5 1 8Z" fill="#d7a24a"/>
            <path d="M25 8C23.5 3 20.5 1 17.5 1C15 1 13.5 4 14 8C14.3 5.5 16 3 17.5 3C19.5 3 22.5 5 25 8Z" fill="#d7a24a"/>
            <rect x="7.7" y="3.5" width="1.6" height="4" rx="0.8" fill="#14110d"/>
            <rect x="16.7" y="3.5" width="1.6" height="4" rx="0.8" fill="#14110d"/>
          </svg>
          <div class="header-name">Yari</div>
        </div>
      </div>
      <div class="header-right">
        <button class="new-chat-btn" id="newChatBtn">+ новый</button>
        <button class="chats-toggle" id="profileToggle">профиль</button>
        <div class="header-status" id="status">на связи</div>
      </div>
    </header>

    <div class="chats-panel" id="chatsPanel"></div>

    <div class="profile-panel" id="profilePanel">
      <div>
        <div class="profile-section-label">цвет твоего облачка</div>
        <div class="swatches" id="swatches">
          <button class="swatch" style="background:#e2a48f" data-color="#e2a48f" title="персик"></button>
          <button class="swatch" style="background:#c98a86" data-color="#c98a86" title="пыльная роза"></button>
          <button class="swatch" style="background:#d7a24a" data-color="#d7a24a" title="золото"></button>
          <button class="swatch" style="background:#8ba79a" data-color="#8ba79a" title="шалфей"></button>
          <button class="swatch" style="background:#a89bb0" data-color="#a89bb0" title="лаванда"></button>
          <button class="swatch" style="background:#e8dfd2" data-color="#e8dfd2" title="бумага"></button>
          <input type="color" class="swatch-custom" id="customColor" title="свой цвет" />
        </div>
      </div>
      <div>
        <div class="profile-section-label">угловатость облачков</div>
        <div class="radius-row">
          <input type="range" id="radiusSlider" min="0" max="26" value="14" />
          <div class="radius-preview" id="radiusPreview"></div>
        </div>
      </div>
    </div>

    <main class="chat" id="chat"></main>

    <form class="composer" id="composer">
      <textarea id="input" placeholder="напиши что-нибудь…" rows="1"></textarea>
      <button type="submit" id="send">отправить</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
